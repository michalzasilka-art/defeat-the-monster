<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <!-- "How to play" frame: cracked stone slab, broken rocks around the edge, faint orange/purple glow -->
  <defs>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2740"/>
      <stop offset="1" stop-color="#1a1625"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6784"/>
      <stop offset=".4" stop-color="#474158"/>
      <stop offset="1" stop-color="#262133"/>
    </linearGradient>
    <linearGradient id="rockDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d5773"/>
      <stop offset="1" stop-color="#211c2c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset=".22" stop-color="#b36bff"/>
      <stop offset=".78" stop-color="#b36bff"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-10" y="-10" width="420" height="140">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>


  <!-- slab with a faint glowing rim -->
  <rect x="23" y="21" width="354" height="78" rx="11" fill="none" stroke="url(#rim)" stroke-width="3" opacity=".75" filter="url(#glow)"/>
  <rect x="24" y="22" width="352" height="76" rx="10" fill="url(#slab)" stroke="#120e1b" stroke-width="2"/>
  <g fill="none" stroke="#120e1b" stroke-width="1" opacity=".75">
    <path d="M250 24 L258 40 L252 52 L262 70"/>
    <path d="M330 96 L322 80 L334 66"/>
    <path d="M120 96 L128 84 L122 72"/>
  </g>
  <rect x="26" y="24" width="348" height="72" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".05"/>

  <!-- top row of broken blocks -->
  <g fill="url(#rock)" stroke="#1d1829" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="34,17 74,14 77,27 36,30"/>
    <polygon points="80,15 132,13 134,26 82,28"/>
    <polygon points="137,14 196,15 194,27 139,27"/>
    <polygon points="200,15 254,13 257,27 198,28"/>
    <polygon points="261,14 314,15 312,28 259,27"/>
    <polygon points="318,15 362,17 360,29 316,28"/>
    <polygon points="226,6 238,3 244,12 232,15"/>
  </g>
  <!-- bottom row -->
  <g fill="url(#rockDark)" stroke="#1d1829" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="38,92 90,94 88,106 40,104"/>
    <polygon points="95,93 150,92 152,105 93,106"/>
    <polygon points="156,92 214,94 212,106 154,105"/>
    <polygon points="219,93 272,92 274,105 217,106"/>
    <polygon points="278,92 330,94 328,106 276,105"/>
    <polygon points="334,93 364,91 368,104 332,105"/>
    <polygon points="140,104 152,102 156,112 143,114"/>
  </g>
  <!-- glow seeping out from under the stones (kept subtle) -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 38 L16 56 L24 70 L18 90" stroke="#ff9a3c" stroke-width="2.4"/>
    <path d="M36 102 L70 106 L100 101" stroke="#ff9a3c" stroke-width="2"/>
    <path d="M44 14 L60 18" stroke="#ff9a3c" stroke-width="1.6"/>
    <path d="M150 18 L176 14 L205 19" stroke="#b36bff" stroke-width="2"/>
    <path d="M226 104 L262 108 L290 102" stroke="#b36bff" stroke-width="2"/>
    <path d="M380 30 L386 50 L378 66 L384 86" stroke="#ff9a3c" stroke-width="2.4"/>
    <path d="M318 16 L344 13 L366 19" stroke="#ff9a3c" stroke-width="2"/>
    <path d="M300 104 L330 108 L356 104" stroke="#b36bff" stroke-width="1.8"/>
  </g>
  <!-- left cluster -->
  <g fill="url(#rock)" stroke="#1d1829" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="4,42 20,30 36,38 32,60 10,63"/>
    <polygon points="6,66 28,61 38,80 22,94 5,86"/>
    <polygon points="14,20 34,11 45,24 31,34"/>
    <polygon points="12,94 31,90 41,105 22,112"/>
  </g>
  <!-- right cluster -->
  <g fill="url(#rock)" stroke="#1d1829" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="396,42 380,30 364,38 368,60 390,63"/>
    <polygon points="394,66 372,61 362,80 378,94 395,86"/>
    <polygon points="386,20 366,11 355,24 369,34"/>
    <polygon points="388,94 369,90 359,105 378,112"/>
  </g>
  <!-- shading and cracks on the big end rocks -->
  <g fill="url(#shade)" stroke="none">
    <polygon points="4,42 20,30 36,38 32,60 10,63"/><polygon points="6,66 28,61 38,80 22,94 5,86"/>
    <polygon points="396,42 380,30 364,38 368,60 390,63"/><polygon points="394,66 372,61 362,80 378,94 395,86"/>
  </g>
  <g fill="none" stroke="#1d1829" stroke-width=".9" opacity=".8">
    <path d="M18 34 L22 46 L16 54"/><path d="M20 66 L24 78"/><path d="M382 34 L378 46 L384 54"/><path d="M380 66 L376 78"/>
    <path d="M100 14 L104 22"/><path d="M280 94 L284 102"/>
  </g>
  <!-- glowing seams between the end rocks -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-width="1.4">
    <path d="M10 63 L30 61" stroke="#ff9a3c"/><path d="M390 63 L370 61" stroke="#ff9a3c"/>
    <path d="M31 34 L36 38" stroke="#b36bff"/><path d="M369 34 L364 38" stroke="#b36bff"/>
  </g>
  <!-- rock highlights -->
  <g fill="none" stroke="#b2abc8" stroke-opacity=".35" stroke-width="1">
    <path d="M36 18 L73 15"/><path d="M82 16 L131 14"/><path d="M202 16 L253 14"/><path d="M320 16 L361 18"/>
    <path d="M6 42 L20 31 L34 38"/><path d="M16 20 L33 12"/><path d="M394 42 L380 31 L366 38"/><path d="M384 20 L367 12"/>
  </g>
  <!-- debris -->
  <g fill="#4b4560" stroke="#1d1829" stroke-width=".8">
    <polygon points="0,28 5,25 8,31 2,33"/>
    <polygon points="48,6 53,4 55,9 50,11"/>
    <polygon points="44,110 50,108 51,114 45,115"/>
    <polygon points="400,28 395,25 392,31 398,33"/>
    <polygon points="352,6 347,4 345,9 350,11"/>
    <polygon points="356,110 350,108 349,114 355,115"/>
  </g>
  <!-- sparks -->
  <g opacity=".8">
    <circle cx="10" cy="26" r="1" fill="#ffb15e"/><circle cx="58" cy="10" r=".9" fill="#c79bff"/>
    <circle cx="392" cy="100" r="1" fill="#ffb15e"/><circle cx="344" cy="112" r=".9" fill="#c79bff"/>
    <circle cx="382" cy="14" r="1" fill="#c79bff"/><circle cx="18" cy="104" r=".9" fill="#ffb15e"/>
  </g>
</svg>
